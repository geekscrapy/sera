[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sera-dfir"
version = "0.1.0"
description = "SERA — Secure Extraction for Response Agents: CLI-first & MCP forensic log acquisition engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "google-cloud-bigquery>=3.20.0",
    "httpx[socks]>=0.27.0",
    "mcp>=1.2.0",
    "msal>=1.28.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
sera = "sera.cli.app:main"
sera-mcp = "sera.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sera"]
